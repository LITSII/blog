name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build & test
        run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failure as annotations
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          esc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' | sed -e 's/\r/%0D/g'; }
          msg=$(grep -E -A6 'What went wrong|error:|FAILED|Caused by|Exception:' build.log | head -120 | esc)
          echo "::error title=Gradle build::${msg}"
          f=$(grep -l '<failure' build/test-results/test/*.xml 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            detail=$(grep -o 'message="[^"]*"' "$f" | head -1 | cut -c1-3000 | esc)
            causes=$(grep -E 'Caused by' "$f" | sort -u | head -15 | cut -c1-500 | esc)
            echo "::error title=Test failure::${detail}%0A${causes}"
          fi
          exit 0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
