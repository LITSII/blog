name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build & test
        run: ./gradlew build --no-daemon 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failure as annotations
        if: failure()
        shell: bash
        run: |
          esc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1' | sed -e 's/\r/%0D/g'; }
          msg=$(grep -E -A12 'What went wrong|error:|FAILED|Caused by' build.log | head -60 | esc)
          echo "::error title=Gradle build::${msg}"
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            if grep -q '<failure' "$f"; then
              detail=$(grep -E -A8 '<failure|Caused by' "$f" | head -40 | esc)
              echo "::error title=$(basename "$f")::${detail}"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
