# /etc/nginx/conf.d/blog.conf  (샘플)
# - 정적 프론트: /var/www/blog  (frontend/dist 업로드)
# - API: 127.0.0.1:8080 의 Spring Boot로 프록시
# - 관리자(/admin/, /api/admin/, /api/auth/)는 Tailscale 대역(100.64.0.0/10)에서만 허용
# 도메인/HTTPS 적용 전 테스트는 listen 8080 등 대체 포트 사용 가능

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /var/www/blog;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # ---- 보안 헤더 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HTTPS 적용 후 활성화:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 관리자 페이지/API: Tailscale 내부에서만 ----
    location ^~ /admin/ {
        allow 100.64.0.0/10;
        deny all;
        try_files $uri $uri/ =404;
    }

    location ^~ /api/admin/ {
        allow 100.64.0.0/10;
        deny all;
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/blog-proxy.conf;
    }

    location = /api/auth/login {
        allow 100.64.0.0/10;
        deny all;
        limit_req zone=login burst=3 nodelay;
        include /etc/nginx/snippets/blog-proxy.conf;
    }

    location ^~ /api/auth/ {
        allow 100.64.0.0/10;
        deny all;
        include /etc/nginx/snippets/blog-proxy.conf;
    }

    # ---- 공개 API: 조회만 ----
    location ^~ /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/blog-proxy.conf;
    }

    # actuator 등 그 외 백엔드 경로는 외부 노출 안 함
    location ^~ /actuator/ { deny all; }

    # 해시가 붙은 빌드 산출물은 장기 캐시
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # MPA: 각 페이지가 실제 HTML 파일. 없는 경로는 404 (SPA fallback 없음)
    location / {
        try_files $uri $uri/ =404;
    }

    # 숨김 파일 차단
    location ~ /\. { deny all; }
}
