spring:
  application:
    name: blog-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Instant를 TIMESTAMP(UTC)로 저장 (기본값은 TIMESTAMP WITH TIME ZONE)
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # Nginx 뒤에서만 동작하도록 루프백에만 바인딩 (운영에서 0.0.0.0 금지)
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

blog:
  admin:
    # 운영에서는 반드시 환경변수로 주입 (BCrypt 해시, "{bcrypt}$2a$..." 형태)
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  cors:
    # 프론트를 다른 오리진(예: Vite dev 서버)에서 띄울 때만 사용. 같은 도메인 /api 프록시면 비워둠
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:blog;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false

server:
  servlet:
    session:
      cookie:
        secure: false

blog:
  admin:
    # 로컬 전용 계정: admin / admin1234  (운영 프로필에서는 사용되지 않음)
    password-hash: ${ADMIN_PASSWORD_HASH:{bcrypt}$2a$10$BADpvOLCa/A6J8I8oDEq3ei2Qf0fuMFv/.L7b9Lnsq7P1gRgoJMhq}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # OCI Autonomous DB: Wallet 압축을 푼 디렉터리를 TNS_ADMIN으로 지정
    # 예) DB_SERVICE=blogdb_low, DB_WALLET_PATH=/opt/blog/wallet
    url: jdbc:oracle:thin:@${DB_SERVICE}?TNS_ADMIN=${DB_WALLET_PATH}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
